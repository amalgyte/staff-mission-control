<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control — Staff Briefings</title>
    <link rel="stylesheet" href="styles.css?v=202609031151">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        .staff-mini-card {
            cursor: pointer;
            width: 100%;
            text-align: left;
            font: inherit;
            color: inherit;
            transition: border-color 0.2s ease, background 0.2s ease;
        }
        .staff-mini-card:hover {
            border-color: var(--border-accent);
            background: var(--bg-card-hover);
        }
        .staff-mini-card.active {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.08);
        }
        .staff-mini-card.theo.active { border-color: var(--theo-color); }
        .staff-mini-card.poppy.active { border-color: var(--poppy-color); }
        .staff-mini-card.clara.active { border-color: var(--clara-color); }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <header class="command-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/>
                        <line x1="12" y1="2" x2="12" y2="22"/>
                        <line x1="2" y1="8.5" x2="22" y2="8.5"/>
                        <line x1="2" y1="15.5" x2="22" y2="15.5"/>
                    </svg>
                </div>
                <div class="title-block">
                    <h1>MISSION CONTROL</h1>
                    <p class="subtitle">STAFF BRIEFINGS</p>
                </div>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="briefings.html" class="nav-link active">Staff Briefings</a>
            </nav>
            <div class="status-section">
                <div class="status-indicator">
                    <span class="pulse"></span>
                    <span class="status-text">ONLINE</span>
                </div>
                <div class="timestamp" id="header-timestamp">--:--:--</div>
            </div>
        </div>
    </header>
    <main class="page-container">
        <section class="briefings-feed-section">
            <div class="staff-filter">
                <button class="filter-btn active" data-staff="all">ALL</button>
                <button class="filter-btn theo" data-staff="theo">THEO</button>
                <button class="filter-btn poppy" data-staff="poppy">POPPY</button>
                <button class="filter-btn clara" data-staff="clara">CLARA</button>
                <button class="filter-btn nora" data-staff="nora">NORA</button>
                <button class="filter-btn rowan" data-staff="rowan">ROWAN</button>
                <button class="filter-btn julian" data-staff="julian">JULIAN</button>
                <button class="filter-btn maeve" data-staff="maeve">MAEVE</button>
            </div>
            <div class="briefings-feed" id="briefings-feed-container">
                <div class="loading-state">
                    <span class="loader"></span>
                    <span>LOADING BRIEFINGS...</span>
                </div>
            </div>
        </section>
        <aside class="briefings-sidebar">
            <div class="staff-cards">
                <button type="button" class="staff-mini-card theo" data-staff="theo">
                    <div class="staff-badge">THEO</div>
                    <div class="staff-role">Research Briefings</div>
                    <div class="staff-count" id="theo-count">--</div>
                </button>
                <button type="button" class="staff-mini-card poppy" data-staff="poppy">
                    <div class="staff-badge">POPPY</div>
                    <div class="staff-role">Trend Briefings</div>
                    <div class="staff-count" id="poppy-count">--</div>
                </button>
                <button type="button" class="staff-mini-card clara" data-staff="clara">
                    <div class="staff-badge">CLARA</div>
                    <div class="staff-role">Income Briefings</div>
                    <div class="staff-count" id="clara-count">--</div>
                </button>
                <button type="button" class="staff-mini-card nora" data-staff="nora">
                    <div class="staff-badge">NORA</div>
                    <div class="staff-role">Journal</div>
                    <div class="staff-count" id="nora-count">--</div>
                </button>
                <button type="button" class="staff-mini-card rowan" data-staff="rowan">
                    <div class="staff-badge">ROWAN</div>
                    <div class="staff-role">Health</div>
                    <div class="staff-count" id="rowan-count">--</div>
                </button>
                <button type="button" class="staff-mini-card julian" data-staff="julian">
                    <div class="staff-badge">JULIAN</div>
                    <div class="staff-role">Psychologist</div>
                    <div class="staff-count" id="julian-count">--</div>
                </button>
                <button type="button" class="staff-mini-card maeve" data-staff="maeve">
                    <div class="staff-badge">MAEVE</div>
                    <div class="staff-role">PA / advisor</div>
                    <div class="staff-count" id="maeve-count">--</div>
                </button>
            </div>
        </aside>
    </main>
    <footer class="command-footer">
        <div class="footer-content">
            <div class="update-info">
                <span class="update-label">LAST DATA SYNC:</span>
                <span class="update-time" id="last-update">--</span>
            </div>
            <div class="system-info">
                <span>AMALGYTE SYSTEMS</span>
                <span class="divider">|</span>
                <span>v2.0.0</span>
            </div>
        </div>
    </footer>
    <script src="script.js?v=202609031151"></script>
</body>
</html>
