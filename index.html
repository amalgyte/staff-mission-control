<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control — Dashboard</title>
    <link rel="stylesheet" href="styles.css?v=202609031400">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    
    <header class="command-header">
        <div class="header-content">
            <div class="logo-section">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <polygon points="12,2 22,8.5 22,15.5 12,22 2,15.5 2,8.5"/>
                        <line x1="12" y1="2" x2="12" y2="22"/>
                        <line x1="2" y1="8.5" x2="22" y2="8.5"/>
                        <line x1="2" y1="15.5" x2="22" y2="15.5"/>
                    </svg>
                </div>
                <div class="title-block">
                    <h1>MISSION CONTROL</h1>
                    <p class="subtitle">PROJECT DASHBOARD</p>
                </div>
            </div>
            <nav class="main-nav">
                <a href="index.html" class="nav-link active">Dashboard</a>
                <a href="projects.html" class="nav-link">Projects</a>
                <a href="briefings.html" class="nav-link">Staff Briefings</a>
            </nav>
            <div class="status-section">
                <div class="status-indicator">
                    <span class="pulse"></span>
                    <span class="status-text">ONLINE</span>
                </div>
                <div class="timestamp" id="header-timestamp">--:--:--</div>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <section class="dashboard-summary">
            <div class="summary-card">
                <div class="summary-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <div class="summary-data">
                    <span class="summary-value" id="total-projects">--</span>
                    <span class="summary-label">ACTIVE PROJECTS</span>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                </div>
                <div class="summary-data">
                    <span class="summary-value" id="total-staff">--</span>
                    <span class="summary-label">STAFF ASSIGNED</span>
                </div>
            </div>
            <div class="summary-card">
                <div class="summary-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </div>
                <div class="summary-data">
                    <span class="summary-value" id="total-tokens">--</span>
                    <span class="summary-label">TOKENS USED</span>
                </div>
            </div>
        </section>

        <section class="projects-grid" id="projects-container">
            <div class="loading-state">
                <span class="loader"></span>
                <span>LOADING PROJECTS...</span>
            </div>
        </section>

        <section class="board-staff-section">
            <h2 class="section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="section-icon">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                STAFF
            </h2>
            <div class="board-staff-grid" id="board-staff-container">
            </div>
        </section>
    </main>

    <footer class="command-footer">
        <div class="footer-content">
            <div class="update-info">
                <span class="update-label">LAST DATA SYNC:</span>
                <span class="update-time" id="last-update">--</span>
            </div>
            <div class="system-info">
                <span>AMALGYTE SYSTEMS</span>
                <span class="divider">|</span>
                <span>v2.0.0</span>
            </div>
        </div>
    </footer>

    <script src="config.js?v=202609031400"></script>
    <script src="script.js?v=202609031400"></script>
</body>
</html>
